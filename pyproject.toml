[project]
name = "cda-api"
dynamic = ["version"]
description = "CDA files reader"
authors = []
dependencies = [
    "xmltodict>=1.0.4,<2",
]
requires-python = ">=3.10,<3.15"
license = "MIT"
readme = "README.md"
keywords = ["cda"]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
    "ruff>=0.11.2",
]

[project.urls]
Source = "https://github.com/Pierlou/cda-api"

[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
cda_api = ["CHANGELOG.md", "LICENSE", "README.md"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
lint = { extend-select = ["I"] } # ["I"] is to also sort imports with an isort rule
line-length = 100